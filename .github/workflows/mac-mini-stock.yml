name: Mac mini 現貨監控

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 安裝 Chrome
        uses: browser-actions/setup-chrome@v1

      - name: 安裝 Playwright 系統依賴
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq \
            libatk-bridge2.0-0 libnss3 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 \
            libpango-1.0-0 libcairo2 libasound2t64 libatspi2.0-0

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 uv
        uses: astral-sh/setup-uv@v4

      - name: 執行監控
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          PLAYWRIGHT_CHROME_CHANNEL: chrome
        run: uv run --with playwright python github_actions_mac_mini_monitor.py
